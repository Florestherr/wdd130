        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="company-info-and-map">
            <h1>White Water Rafting Company</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>Phone: +1 999 999 9999</p>
            <p>Email: info@whitewater.com</p>

            <div class="map">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d98196.2140510458!2d-73.31171168982912!3d6.6131080908825135!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8e69cf9787aacecd%3A0x4ab3102fffc8e6e!2sR%C3%ADo%20Suarez!5e0!3m2!1ses!2sco!4v1759974560730!5m2!1ses!2sco"
                    width="600" height="450" allowfullscreen="" loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </section>

        <hr>

        <section class="contact-form-section">
            <h2>Send Us a Message</h2>

            <form action="submit_form.php" method="post">
                <fieldset>
                    <label for="user_name">Name:</label>
                    <input type="text" id="user_name" name="user_name" placeholder="Placeholder" required>
                </fieldset>

                <fieldset>
                    <label for="user_email">Email:</label>
                    <input type="email" id="user_email" name="user_email" placeholder="Placeholder" required>
                </fieldset>

                <fieldset class="radio-group">
                    <legend>Message Purpose:</legend>
                    <input type="radio" id="general_inquiry" name="message_purpose" value="general" required>
                    <label for="general_inquiry">General Inquiry</label><br>

                    <input type="radio" id="reservation_question" name="message_purpose" value="reservation">
                    <label for="reservation_question">Reservation Question</label><br>

                    <input type="radio" id="website_suggestion" name="message_purpose" value="suggestion">
                    <label for="website_suggestion">Website Suggestion</label>
                </fieldset>

                <fieldset>
                    <label for="user_message">Message:</label>
                    <textarea id="user_message" name="user_message" rows="5" placeholder="Type here..."></textarea>
                </fieldset>

                <fieldset>
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                </fieldset>

                <fieldset>
                    <button type="submit">Get in Touch!</button>
                </fieldset>
            </form>
        </section>

        <hr>

        <section class="employee-profiles">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/manager3.jpg" alt="Photo of the Main Manager">
                    <figcaption>Main Manager (Job Title)</figcaption>
                </figure>

                <figure>
                    <img src="images/manager2.jpg" alt="Photo of the Engineer">
                    <figcaption>Lead Engineer (Job Title)</figcaption>
                </figure>

                <figure>
                    <img src="images/manager1.jpg" alt="Photo of the Social Media Specialist">
                    <figcaption>Social Specialist (Job Title)</figcaption>
                </figure>
            </div>
        </section>

    </main>

    <footer>
        <p>® 2025 ©, Rafting Time Company - Flor Romero</p>

                <img src="images/instagram.png" alt="Intagram Icon">
        </nav>
        </nav>
    </footer>
</body>
